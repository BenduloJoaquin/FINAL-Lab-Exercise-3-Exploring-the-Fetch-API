
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Demo</title>
</head>
<body>

    <h2>Exploring the Fetch API</h2>

    <h3>GET Request</h3>
    <button id="loadData">Load Post Data</button>
    <div id="output" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px;"></div>

    <h3>POST Request</h3>
    <button id="createPost">Create New Post</button>
    <div id="postOutput" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px;"></div>

    <script>

        // GET REQUEST
        document.getElementById("loadData").addEventListener("click", function() {

            const output = document.getElementById("output");

            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    output.innerHTML = `
                        <strong>Post Title:</strong> ${data.title}<br><br>
                        <strong>Content:</strong> ${data.body}
                    `;
                })
                .catch(error => {
                    output.innerHTML = `<span style="color:red;">Error: ${error.message}</span>`;
                });
        });


        // POST REQUEST
        document.getElementById("createPost").addEventListener("click", function() {

            const postOutput = document.getElementById("postOutput");

            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: "My New Post",
                    body: "Learning Fetch API is fun!",
                    userId: 1
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                postOutput.innerHTML = `
                    <strong>New Post Created!</strong><br><br>
                    <strong>Post ID:</strong> ${data.id}<br>
                    <strong>Title:</strong> ${data.title}<br>
                    <strong>Content:</strong> ${data.body}
                `;
            })
            .catch(error => {
                postOutput.innerHTML = `<span style="color:red;">Error: ${error.message}</span>`;
            });

        });

    </script>

</body>
</html>
